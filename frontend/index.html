<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog Writing Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>Blog Writing Agent</h1>
    <p>Describe a blog. Watch the agents research, plan, write and review it.</p>
  </header>

  <main class="layout">
    <section class="left">
      <form id="form" class="ask">
        <label for="topic">What should the blog be about?</label>
        <textarea id="topic" rows="4" required minlength="3"
          placeholder="e.g. How multi-agent systems are used in customer support in 2026"></textarea>
        <button id="go" type="submit">Write blog</button>
      </form>

      <div class="steps-head">
        <h2>Progress</h2>
        <span id="status" class="status">Idle</span>
      </div>
      <ol id="steps" class="steps">
        <li class="empty">Steps appear here as the agent works.</li>
      </ol>
    </section>

    <section class="right">
      <div class="out-head">
        <h2>Blog</h2>
        <div class="actions" id="actions" hidden>
          <button type="button" id="copy-text">Copy</button>
          <button type="button" id="copy">Copy markdown</button>
          <button type="button" id="download">Download .md</button>
        </div>
      </div>
      <article id="output" class="article">
        <p class="empty">Your finished blog will be shown here.</p>
      </article>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.9/purify.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
